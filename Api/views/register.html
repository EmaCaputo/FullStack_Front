<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Arfuch</title>
    <link rel="stylesheet" href="/styles/login.css">
</head>

<body>

<div class="login-wrapper">
    <div class="login-container">

        <img src="/images/logoArfuch.jpg" class="logo-login">

        <h1 class="titulo-login">
            Arfuch <br>
            <span>Indumentaria</span>
        </h1>

        <h2>Crear Cuenta</h2>

        <form id="registerForm">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Contraseña" required>

            <button type="submit">Registrarse</button>

            <a href="/login" class="btn-volver">← Ya tengo cuenta</a>
        </form>

    </div>
</div>

<script type="module" src="/js/register.js"></script>

<footer class="footer">
    <p>&copy; 1930 Arfuch Indumentaria. Todos los derechos reservados.</p>
</footer>

</body>
</html>
