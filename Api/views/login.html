<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Arfuch</title>
    <link rel="stylesheet" href="/styles/login.css">
    <script type="module" src="/js/main.js"></script>
</head>

<body>

<div class="login-wrapper">
    <div class="login-container">

    <img src="/images/logoArfuch.jpg" class="logo-login">

    <h1 class="titulo-login">
        Arfuch <br>
        <span>Indumentaria</span>
    </h1>

    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Contraseña" required>

        <button type="submit">Ingresar</button>
        <a href="/" class="btn-volver">← Volver</a>
        <a href="/register" class="btn-register">Registrarse</a>
    </form>

<script type="module" src="/js/login.js"></script>

</div>
</div>
<footer class="footer">
    <p>&copy; 1930 Arfuch Indumentaria. Todos los derechos reservados.</p>
</footer>
</body>
</html>
