<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion | Arfuch Indumentaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/login2.css">
</head>
<body>
    <div class="login-page">
        <div class="login-image">
            <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1000&h=1400&fit=crop" alt="Moda">
            <div class="login-image-overlay"></div>
            <div class="login-image-content">
                <h2>Bienvenido a Arfuch</h2>
                <p>Descubri la mejor moda argentina con estilo unico y calidad premium.</p>
            </div>
        </div>
        
        <div class="login-form-container">
            <div class="login-form-wrapper">
                <a href="/" class="login-logo">
                    <div class="titulo-marca">
                        Arfuch
                        <span>Indumentaria</span>
                    </div>
                </a>
                
                <div class="login-header">
                    <h1>Iniciar Sesion</h1>
                    <p>Ingresa tus datos para acceder a tu cuenta</p>
                </div>
                
                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contrasena</label>
                        <input type="password" id="password" name="password" placeholder="Tu contrasena" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span class="checkmark"></span>
                            Recordarme
                        </label>
                        <a href="/recuperar" class="forgot-link">Olvidaste tu contrasena?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                    
                    <div class="divider">
                        <span>o continua con</span>
                    </div>
                    
                    <div class="social-login">
                        <button type="button" class="btn-social">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google
                        </button>
                        <button type="button" class="btn-social">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                            Facebook
                        </button>
                    </div>
                </form>
                
                <p class="register-link">
                    No tenes cuenta? <a href="/registro">Registrate</a>
                </p>
                
                <a href="/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    Volver a la tienda
                </a>
            </div>
        </div>
    </div>
</body>
</html>
